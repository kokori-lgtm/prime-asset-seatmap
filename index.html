.cab-btn{padding:10px 22px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:#fff;border:none;letter-spacing:0.04em;color:#666;transition:all .12s}
.cab-btn.on{background:#1a1a1a;color:#fff}
.search-wrap{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1a1a1a;border-radius:7px;padding:0 14px}
.search-wrap label{font-size:12px;font-weight:700;color:#999;white-space:nowrap;letter-spacing:0.06em;text-transform:uppercase;border-right:1px solid #eee;padding-right:12px;margin-right:2px}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px;font-family:inherit;padding:10px 0;background:transparent;color:#1a1a1a}
.search-wrap input::placeholder{color:#bbb}
#sct{font-size:11px;color:#999;white-space:nowrap}
/* LEGEND */
.leg{display:flex;gap:16px;margin-bottom:10px;font-size:11px;color:#666;flex-wrap:wrap;align-items:center}
.ld{width:12px;height:12px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:4px}
/* GRID */
.gc{overflow-x:auto;padding-bottom:8px}
/* STATS — compact */
.stats-bar{margin-top:12px;margin-bottom:8px;font-size:11px;color:#aaa;letter-spacing:0.03em;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.stats-bar .sv{font-weight:700;font-size:12px}

.warn{padding:10px 14px;background:#fffbf0;border:1px solid #e8a000;border-radius:6px;font-size:11px;color:#7a5000;line-height:1.7;margin-top:10px}

footer{margin-top:28px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#ccc;text-align:center;letter-spacing:0.05em}

let cur='SQ605',q='',cab='eco';

function getRows(s){
  const rs=Object.keys(s).map(k=>parseInt(k));
  if(!rs.length)return[];
  const mn=Math.min(...rs),mx=Math.max(...rs);
  return Array.from({length:mx-mn+1},(_,i)=>mn+i).filter(r=>r!==13);
}

function makeSeat(key,seat,q,mk,W,H,G){
  const isM=q&&mk.includes(key);
  let bg,bd,tx,op='1';
  if(seat){const cv=PC[seat[1]];if(q){if(isM){bg=cv.bg;bd=cv.bd;tx=cv.tx;}else{bg='#f0f0f0';bd='#e0e0e0';tx='#ccc';op='0.28';}}else{bg=cv.bg;bd=cv.bd;tx=cv.tx;}}
  else{bg='#f0f0ee';bd='#ddd';tx='#bbb';}
  const pts=seat?seat[0].split('/'):[null,null];
  const ttx=seat?key+': '+seat[0]+' · '+PNL[seat[1]]:key+': 미배정';
  let h='<div style="width:'+W+'px;height:'+H+'px;border-radius:4px;background:'+bg+';border:1.5px solid '+bd+';display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;margin-right:'+G+'px;opacity:'+op+';flex-shrink:0;cursor:'+(seat?'pointer':'default')+';padding:2px 3px;" onmouseenter="showT(\''+ttx+'\')" onmouseleave="hideT()">';
  if(seat){h+='<div style="font-size:10px;font-weight:700;color:'+tx+';line-height:1.25;text-align:center;">'+(pts[0]||'')+'</div><div style="font-size:9px;color:'+tx+';opacity:0.82;line-height:1.2;margin-top:1px;text-align:center;">'+(pts[1]||'')+'</div>';}
  h+='</div>';
  return h;
}

function buildGrid(seats,cols,nullW,W,H,G,RL){
  const rows=getRows(seats);
  const qu=q.toUpperCase();const mk=q?Object.keys(seats).filter(k=>seats[k][0].includes(qu)):[];
  document.getElementById('sct').textContent=q?mk.length+'석 매칭':'';
  let h='<div style="display:inline-block;min-width:100%;">';
  h+='<div style="display:flex;align-items:center;margin-bottom:6px;padding-left:'+(RL+G)+'px;">';
  cols.forEach(c=>{
    if(!c)h+='<div style="width:'+nullW+'px;flex-shrink:0;"></div>';
    else h+='<div style="width:'+W+'px;text-align:center;font-size:13px;font-weight:700;color:#555;margin-right:'+G+'px;flex-shrink:0;letter-spacing:0.1em;">'+c+'</div>';
  });
  h+='</div>';
  rows.forEach(row=>{
    h+='<div style="display:flex;align-items:center;margin-bottom:'+G+'px;">';
    h+='<div style="width:'+RL+'px;font-size:13px;font-weight:700;color:#777;text-align:right;padding-right:8px;flex-shrink:0;">'+row+'</div>';
    cols.forEach(c=>{
      if(!c){h+='<div style="width:'+nullW+'px;flex-shrink:0;"></div>';return;}
      h+=makeSeat(row+c,seats[row+c],q,mk,W,H,G);
    });
    h+='</div>';
  });
  h+='</div>';
  return{html:h,mk};
}

}
